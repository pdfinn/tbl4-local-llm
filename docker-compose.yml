services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=false
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcpo
    restart: unless-stopped

  # MCP-to-OpenAPI proxy. OpenWebUI's native MCP support is Streamable-HTTP only;
  # mcpo lets us use stdio-based MCP servers (the common case) by exposing them
  # as OpenAPI endpoints. Register each tool in OpenWebUI under
  # Admin Settings → External Tools, using URLs like http://mcpo:8000/<name>.
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    command: ["--config", "/config/mcpo.config.json", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./mcpo.config.json:/config/mcpo.config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  open-webui_data:
